name: Module 5 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gradcafe_test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: gradcafe_test
      PGUSER: postgres
      PGPASSWORD: postgres

    defaults:
      run:
        working-directory: module_5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Verify installed dependencies
        run: |
          python -m pip check

      - name: Run Pylint
        run: |
          py_files=$(find src -type f -name "*.py")
          pylint --fail-under=10.0 $py_files

      - name: Generate dependency graph
        run: |
          pydeps ./src --noshow -o dependency.svg
          test -s dependency.svg

      - name: Run Pytest
        run: |
          pytest

      - name: Install Snyk CLI
        run: |
          npm install -g snyk

      - name: Run Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --package-manager=pip
