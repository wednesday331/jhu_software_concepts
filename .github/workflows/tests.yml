name: Module 4 Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gradcafe_test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: gradcafe_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "psycopg[binary]>=3.1,<4" \
            "SQLAlchemy>=2.0,<3" \
            "Flask>=2.3,<4" \
            beautifulsoup4 \
            websocket-client \
            requests \
            huggingface_hub \
            pytest \
            pytest-cov

      - name: Run Module 4 test suite
        run: |
          python -m pytest ./module_4/tests -v